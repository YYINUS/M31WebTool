name: Weekly Brief

on:
  schedule:
    - cron: "45 19 * * 5"     # Fridays 19:45 UTC (2:45 pm ET in winter); backup for the relay's clock
  # The Weekly Brief's Refresh button starts this through the relay.
  workflow_dispatch:
    inputs:
      date:
        description: "Date YYYY-MM-DD (blank = today; normally a Friday)"
        required: false
      publish_hold:
        description: "Publish even if the GP review holds the brief"
        type: boolean
        default: false

jobs:
  run:
    permissions:
      contents: write
      pages: write
      id-token: write
    uses: ./.github/workflows/reports.yml
    with:
      report: weekly
      date: ${{ inputs.date || '' }}
      publish_hold: ${{ inputs.publish_hold || false }}
    secrets: inherit
