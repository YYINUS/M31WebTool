name: Generate and publish reports

on:
  schedule:
    - cron: "41 11 * * 1-5"   # Daily Brief: weekdays 11:41 UTC (6:41 am ET in winter)
    - cron: "17 13 * * 5"     # Fringe Weekly: Fridays 13:17 UTC, covers Sat–Fri
  workflow_dispatch:
    inputs:
      report:
        description: "Which report to generate"
        type: choice
        options: [daily, fringe, both, none]
        default: daily
      date:
        description: "Daily: date YYYY-MM-DD (blank = today)"
        required: false
      publish_hold:
        description: "Daily: publish even if the GP review holds the brief"
        type: boolean
        default: false
      fringe_start:
        description: "Fringe: window start YYYY-MM-DD (blank = 6 days before end)"
        required: false
      fringe_end:
        description: "Fringe: window end YYYY-MM-DD (blank = today)"
        required: false
  push:
    branches: [main]
    paths: ["data/**", "templates/**", "static/**", "generator/build.py", "gp-brief/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: reports
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      held: ${{ steps.daily.outputs.held }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Decide what to generate
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          REPORT: ${{ inputs.report }}
        run: |
          r="none"
          if [ "$EVENT" = "schedule" ]; then
            if [ "$SCHEDULE" = "17 13 * * 5" ]; then r="fringe"; else r="daily"; fi
          elif [ "$EVENT" = "workflow_dispatch" ]; then
            r="$REPORT"
          fi
          echo "report=$r" >> "$GITHUB_OUTPUT"

      # The GP brief: collect → draft → checks → GP review → revise (max 3).
      # Drafts, reviews and the partner copy with "What next" actions stay in
      # the runner's temp folder and are never committed or uploaded; only
      # public.json (no actions) is published. Logs print summaries only.
      - name: Generate Daily Brief
        id: daily
        if: steps.plan.outputs.report == 'daily' || steps.plan.outputs.report == 'both'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PORTFOLIO_JSON: ${{ secrets.PORTFOLIO_JSON }}
          DAY: ${{ inputs.date }}
          FORCE: ${{ inputs.publish_hold }}
        run: |
          D="${DAY:-$(date -u +%F)}"
          W="$RUNNER_TEMP/gp-brief"
          node gp-brief/run.mjs --date "$D" --work "$W" > "$RUNNER_TEMP/gp-status.json"
          status=$(node -p "JSON.parse(require('fs').readFileSync('$RUNNER_TEMP/gp-status.json','utf8')).status")
          if [ "$status" = "release" ] || [ "$FORCE" = "true" ]; then
            cp "$W/public.json" "data/daily/$D.json"
            echo "Published the $D brief ($status)."
          else
            echo "::warning::The $D brief was HELD by the GP review and not published. Rerun with publish_hold to publish it anyway."
            echo "held=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate Fringe Weekly
        if: steps.plan.outputs.report == 'fringe' || steps.plan.outputs.report == 'both'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          START: ${{ inputs.fringe_start }}
          END: ${{ inputs.fringe_end }}
        run: |
          if [ -n "$START$END" ]; then
            python -m generator.fringe $START $END
          else
            python -m generator.fringe
          fi

      - name: Commit new issue data
        if: steps.plan.outputs.report != 'none'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if ! git diff --cached --quiet; then
            git commit -m "Add ${{ steps.plan.outputs.report }} report $(date -u +%F)"
            git push
          fi

      - name: Build site
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python -m generator.build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: generate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Marks the run failed (so GitHub notifies you) when the brief was held.
  held:
    needs: generate
    if: needs.generate.outputs.held == 'true'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "::error::Today's Daily Brief did not pass the GP review after 3 drafts, so it was not published. Rerun with publish_hold to publish it anyway."
          exit 1
