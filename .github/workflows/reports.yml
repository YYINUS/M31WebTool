name: Build and publish

on:
  # Called by daily.yml and fringe.yml (schedule + "Run workflow" / Refresh buttons).
  workflow_call:
    inputs:
      report: { type: string, required: true }        # daily | fringe | none
      date: { type: string, required: false, default: "" }
      publish_hold: { type: boolean, required: false, default: false }
      fringe_start: { type: string, required: false, default: "" }
      fringe_end: { type: string, required: false, default: "" }
  # A push to main that changes content or design rebuilds the site without calling the API.
  push:
    branches: [main]
    paths: ["data/**", "templates/**", "static/**", "generator/build.py", "gp-brief/**"]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # One generation at a time, so two runs never race to push to main.
    concurrency:
      group: reports-generate
      cancel-in-progress: false
    outputs:
      held: ${{ steps.daily.outputs.held }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Decide what to generate
        id: plan
        env:
          REPORT: ${{ inputs.report }}
        run: echo "report=${REPORT:-none}" >> "$GITHUB_OUTPUT"

      # The GP brief, in named steps so the site's Refresh panel can show progress:
      # collect news → write and review (draft, checks, GP review, revise ≤3).
      # Only public.json is published; drafts, reviews and the quality report
      # stay in the runner's temp folder. Logs print summaries only.
      - name: Check whether an edition is needed
        id: need
        if: steps.plan.outputs.report == 'daily'
        env:
          EVENT: ${{ github.event_name }}
          DAY: ${{ inputs.date }}
        run: |
          D="${DAY:-$(date -u +%F)}"
          echo "day=$D" >> "$GITHUB_OUTPUT"
          # GitHub's own schedule is only a backup for the relay's clock: skip it
          # when an edition for today was made in the last 3 hours.
          if [ "$EVENT" = "schedule" ] && [ -f "data/daily/$D.json" ] && node -e "
            const m = require('./data/daily/$D.json').meta || {};
            process.exit(Date.now() - Date.parse(m.generatedAt || 0) < 3 * 3600e3 ? 0 : 1)"; then
            echo "Recent edition exists; skipping this scheduled run."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Collect news
        if: steps.need.outputs.run == 'true'
        env:
          PORTFOLIO_JSON: ${{ secrets.PORTFOLIO_JSON }}
        run: node gp-brief/collect-cli.mjs "$RUNNER_TEMP/gp-brief"

      - name: Write and review the brief
        id: daily
        if: steps.need.outputs.run == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PORTFOLIO_JSON: ${{ secrets.PORTFOLIO_JSON }}
          GP_BRIEF_EFFORT: ${{ vars.GP_BRIEF_EFFORT }}
          GP_BRIEF_JUDGE_EFFORT: ${{ vars.GP_BRIEF_JUDGE_EFFORT }}
          D: ${{ steps.need.outputs.day }}
          FORCE: ${{ inputs.publish_hold }}
        run: |
          W="$RUNNER_TEMP/gp-brief"
          node gp-brief/run.mjs --date "$D" --work "$W" > "$RUNNER_TEMP/gp-status.json"
          status=$(node -p "JSON.parse(require('fs').readFileSync('$RUNNER_TEMP/gp-status.json','utf8')).status")
          if [ "$status" = "release" ] || [ "$FORCE" = "true" ]; then
            cp "$W/public.json" "data/daily/$D.json"
            echo "Published the $D brief ($status)."
          else
            echo "::warning::The $D brief was HELD by the GP review and not published."
            echo "held=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate Fringe Weekly
        if: steps.plan.outputs.report == 'fringe' || steps.plan.outputs.report == 'both'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          START: ${{ inputs.fringe_start }}
          END: ${{ inputs.fringe_end }}
        run: |
          if [ -n "$START$END" ]; then
            python -m generator.fringe $START $END
          else
            python -m generator.fringe
          fi

      - name: Commit new issue data
        if: steps.plan.outputs.report != 'none'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if ! git diff --cached --quiet; then
            git commit -m "Add ${{ steps.plan.outputs.report }} report $(date -u +%F)"
            git pull --rebase --quiet origin "${GITHUB_REF_NAME}"
            git push
          fi

      - name: Publish
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          # The refresh relay's URL (Settings → Secrets and variables → Actions → Variables).
          REFRESH_ENDPOINT: ${{ vars.REFRESH_ENDPOINT }}
        run: python -m generator.build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: generate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Marks the run failed (so GitHub notifies you) when the brief was held.
  held:
    needs: generate
    if: needs.generate.outputs.held == 'true'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "::error::Today's Daily Brief did not pass the GP review after 3 drafts, so it was not published. Run the Daily Brief workflow again with publish_hold ticked to publish it anyway."
          exit 1
